<!doctype html>
<!--
  lang="fil": the UI is Taglish (helps screen readers).
  translate="no" + notranslate: stop Chrome from offering to translate the page.
  Auto-translation garbles the Taglish labels and can break React (it rewrites
  the text React is updating, e.g. the timer and scores).
-->
<html lang="fil" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand indigo (brand-900) for the phone's browser bar -->
    <meta name="theme-color" content="#231F55" />
    <meta
      name="description"
      content="EncoDojo: libreng practice para sa Encoder at Data Entry jobs — typing, numpad, at assessment."
    />
    <title>EncoDojo — Encoder at Data Entry practice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
